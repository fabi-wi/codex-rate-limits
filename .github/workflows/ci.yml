name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift Version
        run: |
          swift --version
          xcrun --show-sdk-version

      - name: Check Shell Scripts
        run: for script in scripts/*.sh; do bash -n "$script" || exit; done

      - name: Test and Package App
        run: ./scripts/package_release.sh

      - name: Upload Verified Release Assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexRateLimits-macos-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
